# Restart the simulation after editing. Positions are in metres, angles in degrees.
# Simulation placement only; navigation never receives these robot/dock poses.
# World yaw: 0 faces +X, 90 faces +Y, 180 faces -X.
robot:
  x: 6.5
  y: -2.0
  yaw_deg: 180.0

dock:
  x: -0.8
  y: 0
  yaw_deg: 0

# Some alternative robot/dock starting poses:
# | Arrangement | Robot starting pose | Dock pose |
# |---|---|---|
# | Southwest → northeast | (-0.5, -2.5, 0) | (6.8, 2.4, 180) |
# | Northwest → southeast | (-0.5, 2.5, 0) | (6.8, -2.4, 180) |
# | Northeast → southwest | (6.5, 2.5, 180) | (-0.8, -2.4, 0) |
# | Southeast → northwest | (6.5, -2.5, 180) | (-0.8, 2.4, 0) |
# | West → east, centred | (-0.5, 0, 0) | (6.8, 0, 180) |
# | East → west, centred | (6.5, 0, 180) | (-0.8, 0, 0) |

# Camera optical frame in the robot base frame (base: x forward, y left, z up).
# Optical axes: x right, y down, z forward. These angles give a forward-facing camera.
# Rotation convention: Rz(yaw) @ Ry(pitch) @ Rx(roll).
camera:
  position_m: [0.076, 0.0, 0.103]
  rpy_deg: [-90.0, 0.0, -90.0]
  fov_y_deg: 48.8
  # Intrinsics are calculated from this FOV and the image resolution; distortion is zero.

# LiDAR frame in the robot base frame. The 2D scan stays horizontal.
lidar:
  position_m: [-0.049, 0.0, 0.1255]
  yaw_deg: 0.0

# Shared sensing/perception/estimation update rate and repeatable noise seed.
# Standard deviations are initial tuning assumptions, not calibrated accuracy.
# Position values apply to both x and y; heading values are in degrees.
estimation:
  update_hz: 50.0
  noise_seed: 42
  process_position_std_m_per_sqrt_s: 0.01
  process_heading_std_deg_per_sqrt_s: 2.0

# Local odometry starts at the first usable marker; the unknown dock is estimated.
# Robot-base target distances from the dock origin along its outward-facing +X.
# Clearance includes the robot footprint and a margin, not just the LiDAR origin.
navigation:
  # LQI reaches this point along the dock normal; arrival heading stays free.
  # Tolerance is distance to that point, not distance to the dock itself.
  coarse_distance_m: 1.5
  coarse_tolerance_m: 0.25
  # PBVS then reaches/aligns at approach_distance_m before final docking.
  pbvs_speed_mps: 0.15
  approach_distance_m: 0.7 # Set it quite far away
  dock_distance_m: 0.30
  # Travel faster in open space; keep final docking slow for precision.
  # These are command limits, so ramps, turns and wheel limits can reduce speed.
  drive_speed_mps: 0.22
  dock_speed_mps: 0.06
  turn_speed_rad_s: 0.6
  clearance_m: 0.25
  position_tolerance_m: 0.03
  heading_tolerance_deg: 3.0
  # Continue on encoder prediction after acquisition; no marker-loss timeout.
  lidar_timeout_s: 0.5
  # Timed commands before marker acquisition; actual angle/distance are not measured.
  search_spin_s: 20.0
  search_drive_s: 3.0
  # Stop/report if estimated position fails to progress during boundary following.
  progress_timeout_s: 30.0
  # Follow one side of a LiDAR cluster until the goal corridor clears.
  # Connect neighbouring returns up to this gap; physical clearance stays separate.
  boundary_join_gap_m: 0.8
  detour_step_m: 0.4
  detour_speed_mps: 0.14
  # Total time budget for obstacle detours, independent of marker visibility.
  detour_timeout_s: 180.0
